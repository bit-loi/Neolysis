# ============================================
# Neolysis — Full Stack Docker Compose
# ============================================
# Run from project root: docker compose up --build
#
# Services:
#   - backend-api    : FastAPI backend (port 8000)
#   - db             : PostgreSQL 16 (port 5432)
#   - redis          : Redis cache (port 6379)
#   - celery-worker  : Background task worker
#   - qdrant         : Vector DB for RAG (port 6333)
#   - frontend       : Next.js frontend (port 3001)

services:
  # ── Backend API ───────────────────────────────────────────────
  backend-api:
    build:
      context: ./neolysis-backend
      dockerfile: Dockerfile
    container_name: neolysis-api
    ports:
      - "8000:8000"
    env_file:
      - ./neolysis-backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/neolysis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-me-in-production-use-a-long-random-string
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - docking_data:/app/storage/docking
    restart: unless-stopped
    command: >
      sh -c "python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - neolysis-net

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: neolysis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neolysis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neolysis-net

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: neolysis-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neolysis-net

  # ── Celery Worker ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./neolysis-backend
      dockerfile: Dockerfile
    container_name: neolysis-celery
    command: celery -A app.core.worker celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/neolysis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-me-in-production-use-a-long-random-string
    env_file:
      - ./neolysis-backend/.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - neolysis-net

  # ── Qdrant Vector DB ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neolysis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neolysis-net

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: neolysis-frontend/Dockerfile
    container_name: neolysis-frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend-api:8000
    depends_on:
      backend-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - neolysis-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  docking_data:

networks:
  neolysis-net:
    driver: bridge
